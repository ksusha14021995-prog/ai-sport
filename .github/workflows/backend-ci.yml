name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aisport
          POSTGRES_PASSWORD: aisport
          POSTGRES_DB: aisport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aisport:aisport@localhost:5432/aisport_test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Detect tests
        id: detect
        run: |
          if [ -d backend/tests ] && [ -n "$(find backend/tests \( -name 'test_*.py' -o -name '*_test.py' \) | head -n1)" ]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/tests has no tests yet, skipping"
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.has_tests == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/pyproject.toml

      - name: Install dependencies
        if: steps.detect.outputs.has_tests == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e ".[test]" || pip install -e .
          fi
          python -c "import pytest" 2>/dev/null || pip install pytest

      - name: pytest
        if: steps.detect.outputs.has_tests == 'true'
        working-directory: backend
        run: python -m pytest -q
