name: ios-build

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Package unsigned .ipa
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry ai-sport-unsigned.ipa Payload
          ls -lh ai-sport-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ai-sport-unsigned-ipa-${{ github.ref_name }}-${{ github.run_number }}
          path: app/build/ipa/ai-sport-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
