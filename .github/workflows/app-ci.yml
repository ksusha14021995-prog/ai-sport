name: app-ci

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze

      - name: flutter test
        run: |
          if [ -d test ] && [ -n "$(find test -name '*_test.dart' -print -quit)" ]; then
            flutter test
          else
            echo "::notice::app/test has no *_test.dart files, skipping flutter test"
          fi

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: ai-sport-debug-apk-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
