<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AI-sport — контроль техники</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Unbounded:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9BE0C0}a:hover{color:#CFEBDD}
button:focus-visible{outline:2px solid #9BE0C0;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D1411; color: #F2F5F1; font-family: Manrope, system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: #18221E"></div>
  <div style="position: absolute; left: 0; right: 0; top: 560px; height: 1px; background: #33423B"></div>
  <div style="position: absolute; left: 0; right: 0; top: 561px; bottom: 0; background: #141C19"></div>

  <svg width="300" height="520" viewBox="0 0 300 520" fill="none" role="img" aria-label="{{poseLabel}}" style="position: absolute; left: 45px; top: 100px">
    <circle cx="150" cy="{{headY}}" r="24" stroke="#9BE0C0" stroke-width="4"></circle>
    <path d="{{bones}}" stroke="#9BE0C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="{{joints}}" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"></path>
    <path d="{{knees}}" stroke="{{kneeColor}}" stroke-width="20" stroke-linecap="round"></path>
  </svg>

  <div style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; align-items: center; gap: 10px">
    <a href="SetResult.dc.html" aria-label="Завершить подход" style="width: 48px; height: 48px; border-radius: 24px; background: rgba(13,20,17,0.8); display: flex; align-items: center; justify-content: center; color: #F2F5F1">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex-grow: 1; background: rgba(13,20,17,0.8); border-radius: 24px; height: 48px; display: flex; align-items: center; padding: 0 16px; gap: 10px">
      <span style="font-size: 14px; font-weight: 700">Приседание</span>
      <span style="font-size: 13px; color: #B9C5BE">подход 1/3</span>
    </div>
    <button type="button" onClick="{{togglePause}}" aria-label="{{pauseLabel}}" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: rgba(13,20,17,0.8); color: #F2F5F1; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{running}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
      <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></sc-if>
    </button>
  </div>

  <div style="position: absolute; left: 16px; top: 84px; background: rgba(13,20,17,0.8); border-radius: 20px; padding: 12px 16px; text-align: left">
    <div style="font-size: 12px; color: #B9C5BE; font-weight: 600">Повторы</div>
    <div style="font-family: Unbounded, sans-serif; font-weight: 600; font-size: 34px; line-height: 1.1; margin-top: 2px" aria-live="polite">{{rep}}<span style="font-size: 18px; color: #B9C5BE"> / 12</span></div>
  </div>
  <div style="position: absolute; right: 16px; top: 84px; background: rgba(13,20,17,0.8); border-radius: 20px; padding: 12px 16px; text-align: right">
    <div style="font-size: 12px; color: #B9C5BE; font-weight: 600">Угол в колене</div>
    <div style="font-family: Unbounded, sans-serif; font-weight: 600; font-size: 22px; margin-top: 4px">{{angle}}°</div>
    <div style="font-size: 12px; color: #B9C5BE; margin-top: 2px">цель — 90°</div>
  </div>

  <div style="{{hintBox}}" aria-live="assertive">
    <div style="{{hintIcon}}">
      <sc-if value="{{error}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l5 6 5-6M7 20l5-6 5 6"></path></svg></sc-if>
      <sc-if value="{{good}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B3D2F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
    </div>
    <div>
      <div style="font-weight: 800; font-size: 17px">{{hintTitle}}</div>
      <div style="font-size: 14px; margin-top: 2px; line-height: 1.4">{{hintText}}</div>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 32px">
    <a href="SetResult.dc.html" style="height: 56px; border-radius: 28px; background: #F2F5F1; color: #0D1411; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">{{finishLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rep: 6, down: false, running: true };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const { rep, down, running } = this.state;
      if (!running || rep >= 12) return;
      if (down) this.setState({ down: false, rep: rep + 1 });
      else this.setState({ down: true });
    }, 1100);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  pose(down, kneesIn) {
    const P = down
      ? { head: 140, sh: [[110, 190], [190, 190]], el: [[112, 250], [188, 250]], wr: [[140, 232], [160, 232]], hip: [[124, 320], [176, 320]], kn: kneesIn ? [[136, 380], [164, 380]] : [[100, 372], [200, 372]], an: [[116, 470], [184, 470]] }
      : { head: 66, sh: [[110, 116], [190, 116]], el: [[100, 186], [200, 186]], wr: [[106, 252], [194, 252]], hip: [[124, 256], [176, 256]], kn: [[120, 362], [180, 362]], an: [[116, 470], [184, 470]] };
    const L = (a, b) => 'M' + a[0] + ' ' + a[1] + 'L' + b[0] + ' ' + b[1];
    const neck = [150, P.head + 24];
    const mid = [150, (P.hip[0][1])];
    const bones = [
      L(neck, [150, P.sh[0][1]]), L(P.sh[0], P.sh[1]), L([150, P.sh[0][1]], mid), L(P.hip[0], P.hip[1]),
      L(P.sh[0], P.el[0]), L(P.el[0], P.wr[0]), L(P.sh[1], P.el[1]), L(P.el[1], P.wr[1]),
      L(P.hip[0], P.kn[0]), L(P.kn[0], P.an[0]), L(P.hip[1], P.kn[1]), L(P.kn[1], P.an[1])
    ].join('');
    const dot = (p) => 'M' + p[0] + ' ' + p[1] + 'l0 0';
    const joints = [P.sh[0], P.sh[1], P.el[0], P.el[1], P.wr[0], P.wr[1], P.hip[0], P.hip[1], P.an[0], P.an[1]].map(dot).join('');
    return { head: P.head, bones, joints, knees: dot(P.kn[0]) + dot(P.kn[1]) };
  }
  renderVals() {
    const { rep, down, running } = this.state;
    const error = down && (rep === 2 || rep === 6 || rep === 9);
    const p = this.pose(down, error);
    const done = rep >= 12;
    const hintBase = 'position: absolute; left: 16px; right: 16px; bottom: 104px; border-radius: 24px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; ';
    const iconBase = 'width: 40px; height: 40px; border-radius: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; ';
    return {
      rep, running, paused: !running, error, good: !error,
      headY: p.head, bones: p.bones, joints: p.joints, knees: p.knees,
      kneeColor: error ? '#FF8A5C' : '#FFFFFF',
      angle: down ? (error ? 88 : 94) : 172,
      poseLabel: error ? 'Скелет: колени завалены внутрь' : (down ? 'Скелет в нижней точке приседа' : 'Скелет в верхней точке'),
      hintBox: hintBase + (error ? 'background: #B4471E; color: #FFFFFF;' : 'background: #F2F5F1; color: #14201A;'),
      hintIcon: iconBase + (error ? 'background: rgba(255,255,255,0.18);' : 'background: #9BE0C0;'),
      hintTitle: error ? 'Колени уходят внутрь' : (done ? 'Подход готов!' : 'Хорошо, так держать'),
      hintText: error ? 'Разведи их по линии стоп — как будто раздвигаешь пол' : (done ? '12 из 12. Отдых 60 секунд' : 'Спина ровная, глубина в норме'),
      finishLabel: done ? 'Посмотреть итог подхода' : 'Завершить подход',
      pauseLabel: running ? 'Пауза' : 'Продолжить',
      togglePause: () => this.setState({ running: !running })
    };
  }
}
</script>
</body>
</html>
