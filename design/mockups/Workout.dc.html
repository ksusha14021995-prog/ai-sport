<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AI-sport — состав тренировки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Unbounded:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#146C54}a:hover{color:#0B3D2F}
button:focus-visible{outline:2px solid #146C54;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; color: #14201A; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 20px 32px; overflow: hidden">
  <a href="Home.dc.html" aria-label="Назад" style="width: 48px; height: 48px; margin-left: -8px; display: flex; align-items: center; justify-content: center; border-radius: 24px; color: #14201A">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
  </a>
  <div style="font-size: 14px; color: #4A5750; margin-top: 8px">Среда · тренировка 4 из 24</div>
  <h1 style="margin: 4px 0 0; font-family: Unbounded, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.3px">Ноги и кор</h1>
  <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap">
    <span style="background: #FFFFFF; border-radius: 12px; padding: 6px 12px; font-size: 13px; font-weight: 600">30 мин</span>
    <span style="background: #FFFFFF; border-radius: 12px; padding: 6px 12px; font-size: 13px; font-weight: 600">Без инвентаря</span>
    <span style="background: #FFFFFF; border-radius: 12px; padding: 6px 12px; font-size: 13px; font-weight: 600">Коврик</span>
  </div>

  <ol style="list-style: none; margin: 20px 0 0; padding: 4px 16px; background: #FFFFFF; border-radius: 24px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
      <li style="{{it.rowStyle}}">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: #E3ECE5; display: flex; align-items: center; justify-content: center; font-family: Unbounded, sans-serif; font-weight: 600; font-size: 14px; color: #0B3D2F; flex-shrink: 0">{{it.n}}</div>
        <div style="flex-grow: 1; min-width: 0">
          <div style="font-weight: 700; font-size: 15px">{{it.name}}</div>
          <div style="font-size: 13px; color: #4A5750; margin-top: 2px">{{it.dose}}</div>
        </div>
        <sc-if value="{{it.ai}}" hint-placeholder-val="{{ false }}">
          <span style="display: inline-flex; align-items: center; gap: 4px; background: #CFEBDD; color: #0B3D2F; border-radius: 10px; padding: 4px 8px; font-size: 12px; font-weight: 700; white-space: nowrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3"></path><circle cx="12" cy="12" r="3"></circle></svg>ИИ
          </span>
        </sc-if>
      </li>
    </sc-for>
  </ol>

  <div style="margin-top: 12px; background: #FFFFFF; border-radius: 20px; padding: 4px 16px">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #E6EAE6">
      <label for="w-cam" style="flex-grow: 1">
        <div style="font-weight: 700; font-size: 15px">Проверять технику камерой</div>
        <div style="font-size: 12px; color: #4A5750; margin-top: 2px">Видео остаётся на телефоне</div>
      </label>
      <button id="w-cam" type="button" role="switch" aria-checked="{{camAria}}" onClick="{{toggleCam}}" style="{{camTrack}}"><span style="{{camThumb}}"></span></button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 60px">
      <label for="w-voice" style="flex-grow: 1; font-weight: 700; font-size: 15px">Голосовые подсказки</label>
      <button id="w-voice" type="button" role="switch" aria-checked="{{voiceAria}}" onClick="{{toggleVoice}}" style="{{voiceTrack}}"><span style="{{voiceThumb}}"></span></button>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="{{startHref}}" style="height: 56px; border-radius: 28px; background: #146C54; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Начать
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cam: true, voice: true };
  }
  sw(on) {
    return {
      track: 'width: 52px; height: 32px; border-radius: 16px; border: 2px solid ' + (on ? '#146C54' : '#6F7C74') + '; background: ' + (on ? '#146C54' : '#E6EAE6') + '; position: relative; cursor: pointer; padding: 0; flex-shrink: 0;',
      thumb: 'position: absolute; top: ' + (on ? '4px' : '6px') + '; left: ' + (on ? '24px' : '6px') + '; width: ' + (on ? '20px' : '16px') + '; height: ' + (on ? '20px' : '16px') + '; border-radius: 12px; background: ' + (on ? '#FFFFFF' : '#6F7C74') + ';'
    };
  }
  renderVals() {
    const { cam, voice } = this.state;
    const c = this.sw(cam), v = this.sw(voice);
    const list = [
      { name: 'Суставная разминка', dose: '4 мин', ai: false },
      { name: 'Приседание', dose: '3 подхода × 12', ai: true },
      { name: 'Выпад назад', dose: '3 × 10 на каждую ногу', ai: true },
      { name: 'Ягодичный мостик', dose: '3 × 15', ai: false },
      { name: 'Планка', dose: '3 × 30 сек', ai: true },
      { name: 'Растяжка', dose: '3 мин', ai: false }
    ];
    return {
      items: list.map((it, i) => ({
        ...it, n: i + 1, ai: it.ai && cam,
        rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 10px 0;' + (i < list.length - 1 ? ' border-bottom: 1px solid #E6EAE6;' : '')
      })),
      camAria: cam ? 'true' : 'false', camTrack: c.track, camThumb: c.thumb,
      voiceAria: voice ? 'true' : 'false', voiceTrack: v.track, voiceThumb: v.thumb,
      toggleCam: () => this.setState({ cam: !cam }),
      toggleVoice: () => this.setState({ voice: !voice }),
      startHref: cam ? 'CameraSetup.dc.html' : 'Done.dc.html'
    };
  }
}
</script>
</body>
</html>
