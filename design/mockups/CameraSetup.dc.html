<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AI-sport — установка камеры</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Unbounded:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9BE0C0}a:hover{color:#CFEBDD}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D1411; color: #F2F5F1; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 20px 32px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Workout.dc.html" aria-label="Закрыть" style="width: 48px; height: 48px; margin-left: -8px; display: flex; align-items: center; justify-content: center; border-radius: 24px; color: #F2F5F1">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <span style="font-size: 14px; font-weight: 600; color: #B9C5BE">Приседание · подход 1 из 3</span>
    <span style="width: 40px"></span>
  </div>

  <div style="margin-top: 12px; height: 440px; border-radius: 28px; background: #1A2420; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center">
    <div style="position: absolute; left: 0; right: 0; bottom: 70px; height: 1px; background: #2E3B35"></div>
    <svg width="170" height="360" viewBox="0 0 170 360" fill="none" role="img" aria-label="Контур, в который нужно встать целиком">
      <g stroke="{{outline}}" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round">
        <circle cx="85" cy="40" r="26"></circle>
        <path d="M45 82h80l14 110M45 82l-14 110M58 82v120l-6 150M112 82v120l6 150M58 202h54"></path>
      </g>
    </svg>
    <div style="position: absolute; top: 16px; left: 16px; display: flex; align-items: center; gap: 6px; background: rgba(13,20,17,0.75); border-radius: 12px; padding: 6px 10px; font-size: 12px; font-weight: 600; color: #B9C5BE">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9BE0C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg>
      Видео не записывается
    </div>
    <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #9BE0C0; color: #0B3D2F; border-radius: 16px; padding: 8px 14px; font-size: 14px; font-weight: 700; white-space: nowrap">Вижу тебя целиком</div>
    </sc-if>
  </div>

  <ul style="list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{checks}}" as="c" hint-placeholder-count="3">
      <li style="display: flex; align-items: center; gap: 12px; font-size: 15px">
        <span style="{{c.dot}}" aria-hidden="true">
          <sc-if value="{{c.ok}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B3D2F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
        </span>
        <span style="{{c.text}}">{{c.label}}</span>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{c.sr}}</span>
      </li>
    </sc-for>
  </ul>

  <div style="flex-grow: 1"></div>
  <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
    <a href="CameraLive.dc.html" style="height: 56px; border-radius: 28px; background: #9BE0C0; color: #0B3D2F; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">Старт — 3, 2, 1</a>
  </sc-if>
  <sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{check}}" style="height: 56px; border-radius: 28px; border: 0; background: #2E3B35; color: #F2F5F1; font-family: inherit; font-weight: 700; font-size: 16px; cursor: pointer">Проверить кадр</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { passed: 1 };
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const passed = this.state.passed;
    const labels = ['Телефон стоит устойчиво на уровне пояса', 'Отойди на 2–3 шага', 'Голова и стопы в кадре'];
    return {
      ready: passed >= 3,
      waiting: passed < 3,
      outline: passed >= 3 ? '#9BE0C0' : '#6F7C74',
      checks: labels.map((label, i) => {
        const ok = i < passed;
        return {
          label, ok, sr: ok ? 'выполнено' : 'ещё нет',
          dot: 'width: 24px; height: 24px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' + (ok ? 'background: #9BE0C0;' : 'border: 2px solid #6F7C74;'),
          text: ok ? 'color: #F2F5F1;' : 'color: #B9C5BE;'
        };
      }),
      check: () => {
        clearInterval(this.timer);
        this.timer = setInterval(() => {
          if (this.state.passed >= 3) { clearInterval(this.timer); return; }
          this.setState({ passed: this.state.passed + 1 });
        }, 700);
      }
    };
  }
}
</script>
</body>
</html>
