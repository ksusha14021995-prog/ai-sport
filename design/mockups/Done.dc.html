<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AI-sport — тренировка завершена</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Unbounded:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#146C54}a:hover{color:#0B3D2F}
button:focus-visible{outline:2px solid #146C54;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; color: #14201A; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; padding: 40px 20px 32px; overflow: hidden">
  <div style="width: 64px; height: 64px; border-radius: 22px; background: #146C54; display: flex; align-items: center; justify-content: center">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
  </div>
  <h1 style="margin: 18px 0 0; font-family: Unbounded, sans-serif; font-weight: 600; font-size: 26px; line-height: 1.2; letter-spacing: -0.3px">Тренировка сделана</h1>
  <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #4A5750">Это уже 4-я за 2 недели. Серия продолжается.</p>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 20px">
    <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 12px"><div style="font-family: Unbounded, sans-serif; font-weight: 600; font-size: 20px">31</div><div style="font-size: 12px; color: #4A5750; margin-top: 2px">минута</div></div>
    <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 12px"><div style="font-family: Unbounded, sans-serif; font-weight: 600; font-size: 20px">6/6</div><div style="font-size: 12px; color: #4A5750; margin-top: 2px">упражнений</div></div>
    <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 12px"><div style="font-family: Unbounded, sans-serif; font-weight: 600; font-size: 20px">8,1</div><div style="font-size: 12px; color: #4A5750; margin-top: 2px">техника</div></div>
  </div>

  <h2 style="margin: 24px 0 4px; font-size: 17px; font-weight: 800">Как ощущения?</h2>
  <p style="margin: 0 0 12px; font-size: 13px; color: #4A5750">Ответ подстроит нагрузку в следующих тренировках</p>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{feels}}" as="f" hint-placeholder-count="4">
      <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
    </sc-for>
  </div>

  <sc-if value="{{pain}}" hint-placeholder-val="{{ false }}">
    <div style="margin-top: 12px; background: #FFE1D3; border-radius: 16px; padding: 14px 16px">
      <label for="d-where" style="display: block; font-size: 14px; font-weight: 700; color: #6B2510">Где болело?</label>
      <input id="d-where" type="text" placeholder="Например: правое колено при выпадах" style="margin-top: 8px; width: 100%; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid #E3B8A4; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 14px">
      <p style="margin: 8px 0 0; font-size: 12px; line-height: 1.4; color: #6B2510">Уберём это упражнение из плана, пока не станет лучше. Если боль сохраняется — обратись к врачу.</p>
    </div>
  </sc-if>
  <sc-if value="{{hint}}" hint-placeholder-val="{{ true }}">
    <p style="margin: 12px 0 0; font-size: 13px; line-height: 1.45; color: #1F3A2E; background: #E3ECE5; border-radius: 14px; padding: 12px 14px">{{hintText}}</p>
  </sc-if>

  <div style="flex-grow: 1"></div>
  <a href="Home.dc.html" style="height: 56px; border-radius: 28px; background: #146C54; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">Готово</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { feel: 'ok' };
  }
  renderVals() {
    const feel = this.state.feel;
    const opts = [
      { id: 'easy', label: 'Легко', hint: 'Следующую тренировку сделаем чуть интенсивнее.' },
      { id: 'ok', label: 'Нормально', hint: 'Отлично, оставляем нагрузку как есть.' },
      { id: 'hard', label: 'Тяжело', hint: 'Добавим отдыха между подходами в следующий раз.' },
      { id: 'pain', label: 'Было больно', hint: '' }
    ];
    const current = opts.find((o) => o.id === feel);
    return {
      feels: opts.map((o) => {
        const on = o.id === feel;
        return {
          ...o, pressed: on ? 'true' : 'false',
          style: 'min-height: 52px; border-radius: 16px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700; ' + (on
            ? (o.id === 'pain' ? 'background: #FFE1D3; border: 2px solid #B4471E; color: #6B2510;' : 'background: #CFEBDD; border: 2px solid #146C54; color: #0B3D2F;')
            : 'background: #FFFFFF; border: 1px solid #C9D2CB; color: #14201A; margin: 1px;'),
          pick: () => this.setState({ feel: o.id })
        };
      }),
      pain: feel === 'pain',
      hint: feel !== 'pain',
      hintText: current ? current.hint : ''
    };
  }
}
</script>
</body>
</html>
